x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Information}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  api:
    container_name: tasktracker-api
    build:
      context: .
      dockerfile: src/TaskTracker.Api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tasktracker;Username=tasktracker;Password=123456"
    depends_on:
      postgres:
          condition: service_healthy
      jaeger:
        condition: service_started

  notifications:
    container_name: tasktracker-notifications
    build:
      context: .
      dockerfile: src/TaskTracker.Notifications/Dockerfile
    ports:
      - "${NOTIFICATIONS_PORT:-8081}:8080"
    environment:
      <<: *app-env
    depends_on:
      - jaeger

  worker:
    container_name: tasktracker-worker
    build:
      context: .
      dockerfile: src/TaskTracker.Worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      - jaeger
    
  postgres:
    image: postgres:17
    container_name: tasktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/TaskTracker.Api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tasktracker -d tasktracker" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # TODO: mongo, rabbitmq

  prometheus:
    container_name: tasktracker-prometheus
    image: prom/prometheus:v3.13.4
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    container_name: tasktracker-grafana
    image: grafana/grafana-oss:13.0.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    container_name: tasktracker-jaeger
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4317}:4317"
    command:
      - "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
      - "--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
  tasktracker.api:
    image: tasktracker.api
    build:
      context: .
      dockerfile: src/TaskTracker.Api/Dockerfile

volumes:
  postgres_data: