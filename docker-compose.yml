x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Information}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  api:
    build:
      context: .
      dockerfile: src/TaskTracker.Api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tasktracker;Username=tasktracker;Password=${POSTGRES_PASSWORD:-123456}"
      Jwt__Issuer: "TaskTracker"
      Jwt__Audience: "TaskTracker.Client"
      Jwt__Key: "${JWT_SIGNING_KEY}"
    depends_on:
      postgres:
          condition: service_healthy
      jaeger:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: src/TaskTracker.Notifications/Dockerfile
    ports:
      - "${NOTIFICATIONS_PORT:-8081}:8080"
    environment:
      <<: *app-env
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: tasktracker
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tasktracker-local}
      Jwt__Issuer: "TaskTracker"
      Jwt__Audience: "TaskTracker.Client"
      Jwt__Key: "${JWT_SIGNING_KEY}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/TaskTracker.Worker/Dockerfile
    environment:
      <<: *app-env
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: tasktracker
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tasktracker-local}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tasktracker;Username=tasktracker;Password=${POSTGRES_PASSWORD:-123456}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tasktracker -d tasktracker" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tasktracker
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tasktracker-local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4317}:4317"
    command:
      - "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
      - "--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
volumes:
  postgres_data:
  rabbitmq_data:
