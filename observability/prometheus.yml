scrape_configs:
  - job_name: "TaskTracker.Api"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8080"]

  - job_name: "TaskTracker.Notifications"
    scrape_interval: 5s
    static_configs:
      - targets: ["notifications:8080"]

  - job_name: "TaskTracker.Worker"
    scrape_interval: 5s
    static_configs:
      - targets: ["worker:8080"]